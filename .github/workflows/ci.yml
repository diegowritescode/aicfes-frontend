name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Bare `tsc --noEmit` resolves no files against the root
      # config, so it always passed. It let an undefined component
      # reach production and hid ten real errors behind it.
      - run: npm run typecheck
      - run: npm run build
        env:
          VITE_API_URL: https://aicfes-backend.deviego.xyz
