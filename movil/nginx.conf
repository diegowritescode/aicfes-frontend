worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # The unprivileged image cannot write to /var, so every temporary path
  # has to live under /tmp.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /healthz {
      access_log off;
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }

    # Hashed assets never change under the same name, so they can be held
    # indefinitely; the entry document must not be.
    location /assets/ {
      include /etc/nginx/security-headers.conf;
      expires 1y;
      add_header Cache-Control "public, immutable" always;
    }

    # A single-page app serves its own routes, so unknown paths fall back
    # to the document rather than 404.
    location / {
      include /etc/nginx/security-headers.conf;
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache" always;
    }
  }
}
