# Repeated per location on purpose: an add_header in a nested block
# discards the ones inherited from its parent, so these cannot live in
# the server block alone.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://aicfes-api.deviego.xyz; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
